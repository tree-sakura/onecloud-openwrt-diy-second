name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  # 取点规则: 本仓库最后一次 2025 提交 096523f(2025-11-04 10:28 UTC)之前最近的 lede master 提交。
  # 该提交 target/linux/amlogic 的 KERNEL_PATCHVER 仍是 6.1, 与 config_device/config_framework
  # 这两份 6.1 内核片段对得上; 换成 master 会让 lede 换内核基线, 片段文件名不再被引用,
  # defconfig 会重新生成整套内核配置。
  REPO_COMMIT: 0894d10e74b7b973881a35b727a2f579b232e4be
  FEEDS_CONF: feeds.conf.default
  APP_CONFIG_FILE: config_app
  FRAMEWORK_CONFIG_FILE: config_framework
  DEVICE_CONFIG_FILE: config_device
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  GEN_BURN_IMG_SH: gen_burn_img.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 释放磁盘空间
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Checkout
      uses: actions/checkout@main

    
        
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo sed -i 's/azure\.//' /etc/apt/sources.list
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(cat dependson)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        [ -n "$REPO_COMMIT" ] && git checkout "$REPO_COMMIT"
        grep -q 'KERNEL_PATCHVER:=6.1' target/linux/amlogic/Makefile || { echo "amlogic 内核基线不是 6.1, 两份内核片段(config-6.1)不会被引用"; exit 1; }
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 钉住 luci feed
      run: |
        cd openwrt/feeds/luci
        # ;master 是 --depth 1 的浅 clone, 里面没有 2025-11 那个提交, 先把历史补全再切
        git fetch --unshallow origin master || git fetch origin master
        git checkout --force fd35efe15c041fc6180a97d269703c8189a165a6
        [ "$(git rev-parse HEAD)" = "fd35efe15c041fc6180a97d269703c8189a165a6" ]

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $APP_CONFIG_FILE ] && mv $APP_CONFIG_FILE openwrt/.config
        [ -e $DEVICE_CONFIG_FILE ] && mv $DEVICE_CONFIG_FILE openwrt/target/linux/amlogic/meson8b/config-6.1
        [ -e $FRAMEWORK_CONFIG_FILE ] && mv $FRAMEWORK_CONFIG_FILE openwrt/target/linux/amlogic/config-6.1
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        JOBS=$(($(nproc)*3/2))
        echo "$JOBS thread compile"
        make -j$JOBS LINUX_VERMAGIC:=hui 2>&1 | tee build.log
        if [ "${PIPESTATUS[0]}" -ne 0 ]; then
          echo "== 并行编译失败, 提取失败目标, 只重编这些部分定位真实报错 =="
          sed -n 's/^ERROR: \(.*\) failed to build\./\1/p' build.log | sort -u > failed.txt
          grep -oE '\*\*\* \[[^]]+\] Error [0-9]+' build.log \
            | sed 's/\*\*\* \[//; s/\] Error [0-9]*//' \
            | grep -vE '\.mk|world|^\[' | sort -u >> failed.txt
          sort -u failed.txt -o failed.txt
          cat failed.txt
          rc=0
          while read -r t; do
            case "$t" in */compile|*/install) ;; *) t="$t/compile";; esac
            echo ""
            echo "======== 单编 $t ========"
            make "$t" -j1 V=s LINUX_VERMAGIC:=hui 2>&1 | tail -120
            [ "${PIPESTATUS[0]}" -ne 0 ] && rc=1
          done < failed.txt
          if [ "$rc" -ne 0 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "== 单包重编全部通过, 属偶发失败, 重跑整体编译 =="
          make -j$JOBS LINUX_VERMAGIC:=hui || { echo "status=failed" >> $GITHUB_OUTPUT; exit 1; }
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
    - name: 上传编译日志(失败时)
      if: failure()
      uses: actions/upload-artifact@main
      with:
        name: build-log
        path: openwrt/build.log
    - name: 生成直刷包
      if: steps.compile.outputs.status == 'success'
      run: |
        chmod +x $GEN_BURN_IMG_SH
        chmod +x AmlImg
        $GITHUB_WORKSPACE/$GEN_BURN_IMG_SH
    - name: Check space usage
      if: (!cancelled())
      run: df -hT
  
    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages feeds.buildinfo version.buildinfo sha256sums profiles.json *.sha *.manifest
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ ${UPLOAD_GOFILE} = true && ${{ steps.gofile.outputs.url }} ] && echo "🔗 [GoFile](${{ steps.gofile.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2.1.0
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
